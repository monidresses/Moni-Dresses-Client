<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — MONI DRESSES</title><script type="module" src="./js/account.js"></script><script type="module" src="./js/account-profile.js"></script></head><body><header><a href="/">MONI DRESSES</a><a href="/orders.html">My Orders</a></header><main><h1>My Account</h1><p id="user">Loading…</p><section><h2>Profile</h2><form id="profile-form"><label>Name <input id="name" autocomplete="name" required></label><label>Email <input id="email" type="email" autocomplete="email"></label><label>Mobile number <input id="phone" type="tel" autocomplete="tel" readonly aria-readonly="true"><small>Your mobile number cannot be changed.</small></label><button type="submit">Save Profile</button></form></section><section><h2>Saved Addresses</h2><div id="addresses">Loading…</div><h3>Add Address</h3><form id="address-form"><input id="label" placeholder="Home / Work"><input id="address-name" placeholder="Full name" required><input id="address-phone" placeholder="Phone" inputmode="tel" required><textarea id="address-line" placeholder="Full address" required></textarea><input id="address-city" placeholder="City" required><input id="address-pin" placeholder="PIN code" inputmode="numeric" maxlength="6" required><button type="submit">Save Address</button></form></section><p id="profile-message" role="alert"></p><button id="logout" disabled>Logout</button></main></body></html>
